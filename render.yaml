services:
  - type: web
    name: revora
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4"
    healthCheckPath: /healthz
    envVars:
      - key: REVORA_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_REQUIRED_APPROVALS
        value: "2"
      - key: PUBLIC_BASE_URL
        sync: false          # optional, e.g. https://your-service.onrender.com
      # SQLite lives on the instance filesystem. On the free plan it is wiped on
      # every deploy/restart. APPROVED PLAN (not applied by this file's author):
      # paid web service + persistent disk. Applying it needs the owner's explicit
      # approval; see docs/OPERATIONS.md (staging first, backups, rollback). To use it:
      # - key: DATABASE_PATH
      #   value: /var/data/revora.db
    # disk:
    #   name: revora-data
    #   mountPath: /var/data
    #   sizeGB: 1
